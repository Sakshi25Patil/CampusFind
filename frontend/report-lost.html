
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Lost Item | CampusFind</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>

<nav class="navbar">
  <div class="logo">Campus<span>Find</span></div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="browse.html">Browse Items</a></li>
    <li><a href="report-lost.html" class="active">Report Lost</a></li>
    <li><a href="report-found.html">Report Found</a></li>
  </ul>
</nav>

<main class="report-page">
  <div class="report-container">

    <h1>Report a Lost Item</h1>
    <p class="report-subtitle">
      Provide the details of your lost item so others can help you find it.
    </p>

    <form id="reportForm">

      <div class="form-group">
        <label for="itemName">Item Name</label>
        <input type="text" id="itemName" name="itemName"
               placeholder="Enter item name" required>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="">Select category</option>
          <option value="Documents">Documents</option>
          <option value="Electronics">Electronics</option>
          <option value="Personal Items">Personal Items</option>
          <option value="Stationery">Stationery</option>
          <option value="Clothing">Clothing</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" name="description"
                  placeholder="Describe your lost item"
                  rows="4" required></textarea>
      </div>

      <div class="form-group">
        <label for="location">Last Seen Location</label>
        <input type="text" id="location" name="location"
               placeholder="Where did you last see it?" required>
      </div>

      <div class="form-group">
        <label for="itemDate">Date Lost</label>
        <input type="date" id="itemDate" name="itemDate" required>
      </div>

      <div class="form-group">
        <label for="studentName">Student Name</label>
        <input type="text" id="studentName" name="studentName"
               placeholder="Enter your name" required>
      </div>

      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact" name="contact"
               placeholder="Enter your contact number"
               pattern="[0-9]{10}" maxlength="10" required>
      </div>

      <button type="submit" class="submit-btn">Submit Lost Report</button>

      <p id="formMessage"></p>

    </form>
  </div>
</main>

<script src="js/report.js"></script>

</body>
</html>
